[project]
name = "pointraft-ptv3-benchmark"
version = "0.1.0"
description = "Isolated Point Transformer V3 scalar-regression benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
    "addict==2.4.0",
    "flash-attn==2.5.5",
    "ninja",
    "numpy==1.26.4",
    "packaging",
    "psutil",
    "setuptools==69.5.1",
    "spconv-cu118==2.3.6",
    "timm==0.9.16",
    "torch==2.1.0",
    "torch-scatter==2.1.2+pt21cu118",
    "torchvision==0.16.0",
    "wheel==0.47.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
no-build-isolation-package = ["flash-attn"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torch-scatter = { index = "pyg-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pyg-cu118"
url = "https://data.pyg.org/whl/torch-2.1.0+cu118.html"
format = "flat"
explicit = true
